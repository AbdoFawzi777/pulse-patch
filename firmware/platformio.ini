; PlatformIO Project Configuration File for PulsePatch Lite
; Target: ESP32-C3 RISC-V Microcontroller + MAX30102 Optical Pulse Sensor

[platformio]
default_envs = esp32-c3-devkitm-1
src_dir = src
include_dir = include

[env:esp32-c3-devkitm-1]
platform = espressif32 @ ^6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -D CONFIG_BT_NIMBLE_ROLE_PERIPHERAL=1
    -D CONFIG_BT_NIMBLE_ROLE_CENTRAL=0
    -D CONFIG_BT_NIMBLE_ROLE_OBSERVER=0
    -D CONFIG_BT_NIMBLE_ROLE_BROADCASTER=0
    -D CORE_DEBUG_LEVEL=1

lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.1
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2


[env:esp32-c3-devkitm-1-debug-raw]
extends = env:esp32-c3-devkitm-1
build_flags =
    ${env:esp32-c3-devkitm-1.build_flags}
    -D DEBUG_RAW

[env:esp32-c3-devkitm-1-i2c-scanner]
extends = env:esp32-c3-devkitm-1
build_flags =
    ${env:esp32-c3-devkitm-1.build_flags}
    -D I2C_SCANNER_ONLY
