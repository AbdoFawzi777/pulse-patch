name: app
description: "PulsePatch Lite - Educational Pulse Biomonitoring"
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  intl: 0.20.2
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  path: ^1.9.1
  permission_handler: ^13.0.2
  flutter_local_notifications: ^22.3.2
  pdf: ^3.12.0
  printing: ^5.14.3
  share_plus: ^13.3.1
  flutter_blue_plus: ^2.3.14
  drift: ^2.19.0
  sqlite3: ^2.4.6
  sqlite3_flutter_libs: ^0.5.24
  file_picker: ^13.2.0
  http: ^1.6.0
  google_maps_flutter: ^2.18.1
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  firebase_app_check: ^0.5.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

dependency_overrides:
  archive: ^4.0.10
  permission_handler_android: 12.1.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/ml/
    - assets/fonts/
    - assets/icon/
    - assets/knowledge/

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Light.ttf
          weight: 300
        - asset: assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
