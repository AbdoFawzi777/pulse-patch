name: app
description: "PulsePatch Lite - Educational Pulse Biomonitoring"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  intl: 0.20.2
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
